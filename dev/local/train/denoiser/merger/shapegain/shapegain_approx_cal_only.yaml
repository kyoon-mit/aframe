# Gain calibration only, no energy weighting.
# Isolates the contribution of making the shape term indifferent to a
# systematic shrink.

trainer:
  default_root_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/denoiser_4s/train/merger/shapegain/shapegain_approx_cal_only
  logger:
    init_args:
      name: claude_shapegain_approx_cal_only
      id: claude-shapegain_approx_cal_only
      save_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/denoiser_4s/train/merger/shapegain/shapegain_approx_cal_only

data:
  init_args:
    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 8.0
        end_params:
          minimum: 8.0
        decay_steps: 31280

model:
  init_args:
    denoiser_loss:
      class_path: train.losses.ApproximateRecoveryLoss
      init_args:
        lambda_gain: 0.05
        lambda_time: 0.1
        lambda_bkg: 1.0
        energy_weight: false
        smooth_ms: 50.0
        calibrate_gain: true
        sig_thresh: 0.5
        sample_rate: 2048.0
