# Pure denoiser training, shape/gain objective.
#
# Replaces the magnitude-spectrum mixture, which was measured to put ~98% of
# its output power at the leading window edge with correlation to the target
# consistent with zero: |FFT| discards phase, so it cannot distinguish a
# chirp from an impulse. Here a scale-free, phase-sensitive shape term drives
# reconstruction and a separate gain term fixes amplitude.
#
# waveform_prob is 0.5, so half the rows are noise only and the denoiser is
# explicitly taught to output zero there (lambda_bkg). Validation runs the
# same injection pipeline as training, since the timeslide path carries no
# clean target.

seed_everything: 20260901

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true

  # each variant sets default_root_dir and logger.init_args.{name,id,save_dir}
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: DENOISER-SCAN

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/rho
        mode: max
        save_top_k: 1
        save_last: true
        filename: den_{epoch:02d}
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: train.callbacks.DenoiserEvolutionCallback
      init_args:
        n_examples: 4
        every_n_epochs: 20
        sample_rate: 2048

model:
  class_path: train.model.denoiser_ky.Denoiser
  init_args:
    arch:
      class_path: architectures.denoiser.TimeDomainS4Denoiser
      init_args:
        num_ifos: 2
        d_model: 64
        d_state: 64
        n_layers: 4
        dropout: 0.2
        prenorm: false
        num_groups: 32
        dt_min: 1e-4
        dt_max: 10.0

    learning_rate: 2.5e-4
    ssm_lr: 2.5e-3
    weight_decay: 0.01
    normalize_input: true

    lr_scheduler:
      class_path: train.model.regression_ky.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 10
        T_0: 20
        T_mult: 2
        eta_min: 1e-7
        peak_decay: 0.9
    lr_scheduler_interval: epoch

data:
  class_path: train.data.supervised.DenoiserOnlyAframeDataset
  init_args:
    background_dir: /home/kyoon/SSM-BNS/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /home/kyoon/SSM-BNS/DATA/aframe/train
    ifos: [H1, L1]
    sample_rate: 2048

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 64
    batches_per_epoch: 782   # ~50k samples per epoch
    val_batches: 78
    chunk_size: 2000
    chunks_per_epoch: 25
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20

    # half the rows are background only, so the denoiser learns to output
    # zero on noise instead of hallucinating a waveform into it
    waveform_prob: 0.5
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 16
    persistent_workers: true

    num_valid_views: 4
    valid_stride: 25
    valid_livetime: 210000

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 20.0     # ramp curriculum 20 -> 4 over 40 epochs
        end_params:
          minimum: 4.0
        decay_steps: 31280  # 40 epochs * 782 batches/epoch

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        num_val_waveforms: 8192
        val_waveform_file: /home/kyoon/SSM-BNS/DATA/aframe/val/end_o3_ratesandpops_bns_snr4.hdf5
        training_waveform_path: /home/kyoon/SSM-BNS/DATA/aframe/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
