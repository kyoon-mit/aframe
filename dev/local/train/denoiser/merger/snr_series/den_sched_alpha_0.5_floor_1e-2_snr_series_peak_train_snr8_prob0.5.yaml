# Denoiser only: time and spectral mixture plus a matched-filter SNR term
# near the true peak (signal) and unnormalized |z|^2 (noise only).
# Train SNR power law -3 from 8 to 100, validation power law -3 from 4 to 100.
# Half the rows are background, whose target series is 0.

seed_everything: 20261006

trainer:
  max_epochs: 800
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true

  default_root_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/den_sched_alpha_0.5_floor_1e-2_snr_series_peak_train_snr8_prob0.5

  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: DENOISER-SCAN
      name: den_sched_alpha_0.5_floor_1e-2_snr_series_peak_train_snr8_prob0.5
      id: den_sched_alpha_0.5_floor_1e-2_snr_series_peak_train_snr8_prob0.5
      save_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/den_sched_alpha_0.5_floor_1e-2_snr_series_peak_train_snr8_prob0.5

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/den_loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: den_{epoch:02d}
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: train.callbacks.ReferenceEventCallback
      init_args:
        events_file: /home/kyoon/SSM-BNS/aframe/data/plot/merger_4s_2048Hz/plot_events.hdf5
        every_n_epochs: 10
        out_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/den_sched_alpha_0.5_floor_1e-2_snr_series_peak_train_snr8_prob0.5/reference_events
        show_input: true

model:
  class_path: train.experimental.snr_series.task.SNRSeriesDenoiser
  init_args:
    arch:
      class_path: architectures.denoiser.TimeDomainS4Denoiser
      init_args:
        num_ifos: 2
        d_model: 128
        d_state: 64
        n_layers: 6
        dropout: 0.2
        prenorm: true
        num_groups: 32
        dt_min: 1e-4
        dt_max: 10.0

    learning_rate: 2.5e-5
    ssm_lr: 2.5e-4
    weight_decay: 0.01
    normalize_input: false
    predict_residual: false
    # one loss term, so the per-term gradient ratio has nothing to compare
    log_grad_every: 50

    denoiser_loss:
      class_path: train.experimental.snr_series.loss.SNRPeakMixtureLoss
      init_args:
        alpha: 0.5
        density: false
        time_loss: mse
        spectral_loss: msle
        log_floor: 0.01
        log_base: 10.0
        huber_delta: 1.0
        scale_momentum: 0.99
        sig_thresh: 0.5
        lambda_amp: 0.0
        log_background: true
        c_rho: 0.0
        # matched-filter gradient matched to the mixture's at initialization
        snr_weight: 0.002
        # lags kept on each side of the true peak: 20 samples, about 10 ms
        peak_halfwidth: 20

    lr_scheduler:
      class_path: train.model.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 10
        T_0: 20
        T_mult: 2
        eta_min: 1e-7
        warmup_start_factor: 0.01
        peak_decay: 0.9
    lr_scheduler_interval: epoch

data:
  class_path: train.data.supervised.DenoiserOnlyAframeDataset
  init_args:
    background_dir: /home/kyoon/SSM-BNS/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /home/kyoon/SSM-BNS/DATA/aframe/train
    test_background_dir: /home/kyoon/SSM-BNS/DATA/O3b_H1_L1_2048Hz
    ifos: [H1, L1]
    sample_rate: 2048.0

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 32
    batches_per_epoch: 1564
    val_batches: 16
    chunk_size: 2000
    chunks_per_epoch: 25
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20.0

    waveform_prob: 0.5
    signal_repeats: 4
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 8
    persistent_workers: true

    num_valid_views: 4
    valid_stride: 25.0
    valid_livetime: 210000.0

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 8.0
        end_params:
          minimum: 8.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    val_snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    param_transforms:
      - class_path: train.transforms.ChirpMass
      - class_path: train.transforms.MassRatio

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        training_waveform_path: /home/kyoon/SSM-BNS/DATA/aframe/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5
        val_waveform_file: /home/kyoon/SSM-BNS/DATA/aframe/val/end_o3_ratesandpops_bns_snr4.hdf5
        num_val_waveforms: 8192

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
