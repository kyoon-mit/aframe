# Copy of sig_only_reg_s4d_complex_energy_max_64x32x4_warp_merger.yaml with dropout 0.0 (4 x 3 table redo, everything else the same).
# Early stopping on val within 1 percent, patience 80.
# Time axis warped by tau = (t_c - t)^(5/8) (merger window); otherwise identical to sig_only_reg_s4d_complex_energy_max_64x32x4.yaml
# Signal only (no detector noise): S4D regressor, d_model 64, d_state 32, 4 layers, regressing chirp mass
# and its uncertainty (Gaussian NLL) from the whitened injected waveform alone,
# scaled to the sampled SNR. 2048 Hz, 50k distinct signals per epoch, training
# and validation SNR from a power law with index -3 from 4. Reduce-on-plateau
# learning rate on val/loss.

seed_everything: 20261006

trainer:
  max_epochs: 800
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true

  default_root_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/sig_only_reg_s4d_complex_energy_max_dropout0_64x32x4_warp_merger

  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: CLAUDE-TESTS
      name: sig_only_reg_s4d_complex_energy_max_dropout0_64x32x4_warp_merger
      id: sig_only_reg_s4d_complex_energy_max_dropout0_64x32x4_warp_merger
      save_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/sig_only_reg_s4d_complex_energy_max_dropout0_64x32x4_warp_merger

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/within_1pct_chirp_mass
        mode: max
        save_top_k: 1
        save_last: true
        filename: ck_{epoch:02d}
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: train.callbacks.ResumableEarlyStopping
      init_args:
        monitor: val/within_1pct_chirp_mass
        mode: max
        patience: 80
        cycle_aware: true
        verbose: true

model:
  class_path: train.experimental.oracle.task.SignalOnlyRegression
  init_args:
    arch:
      class_path: train.experimental.oracle.arch.ComplexS4Regressor
      init_args:
        num_ifos: 2
        num_params: 1
        d_model: 64
        d_state: 32
        n_layers: 4
        dropout: 0.0
        prenorm: true
        num_groups: 32
        dt_min: 0.0001
        dt_max: 10.0
        readout: energy_max

    param_names: [chirp_mass]
    beta_nll: 0.3
    y_mean: [1.8]
    y_std: [0.55]
    lambda_spread: 0.2
    learning_rate: 1e-4
    ssm_lr: 1e-3
    weight_decay: 0.01
    normalize_input: false
    lr_scheduler:
      class_path: train.model.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 10
        T_0: 40
        T_mult: 2
        eta_min: 1e-7
        warmup_start_factor: 0.01
        peak_decay: 0.9
    lr_scheduler_interval: epoch

data:
  class_path: train.experimental.oracle.data.WarpedDenoiserOnlyAframeDataset
  init_args:
    merger_offset: 0.0
    background_dir: /home/kyoon/SSM-BNS/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /home/kyoon/SSM-BNS/DATA/aframe/train
    test_background_dir: /home/kyoon/SSM-BNS/DATA/O3b_H1_L1_2048Hz
    ifos: [H1, L1]
    sample_rate: 2048.0

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 32
    batches_per_epoch: 1564
    val_batches: 64
    chunk_size: 2000
    chunks_per_epoch: 25
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20.0

    waveform_prob: 1.0
    signal_repeats: 1
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 4
    persistent_workers: true

    num_valid_views: 4
    valid_stride: 25.0
    valid_livetime: 210000.0

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    val_snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    param_transforms:
      - class_path: train.transforms.ChirpMass
      - class_path: train.transforms.MassRatio

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        training_waveform_path: /home/kyoon/SSM-BNS/DATA/aframe/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5
        val_waveform_file: /home/kyoon/SSM-BNS/DATA/aframe/val/end_o3_ratesandpops_bns_snr4.hdf5
        num_val_waveforms: 8192

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
