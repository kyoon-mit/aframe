# SLIC score network (Legin et al. 2024, arXiv:2410.19956): PyTorch port of
# scoregen_jax NCSNpp1D with the paper's config_real_white_noise_both.json,
# trained by denoising score matching on whitened noise-only windows. H1 and
# L1 are separate single-channel examples: 32 windows, 64 examples per batch.
# AdamW 2e-5 constant, weight decay 0, gradients clipped at global norm 1,
# weight average 0.999 (used for validation and saved in the checkpoint).
# 200 epochs x 1564 batches x 64 examples = 20.0M examples (paper: 500 epochs
# x 40,000 segments). Data section copied verbatim from
# oracle/sig_only_reg_s4d_64x32x4.yaml.
#
# python -m train.experimental.slic fit --config score.yaml (or run_score.sh)

seed_everything: 43

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true

  default_root_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/slic/score

  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: CLAUDE-TESTS
      name: slic_score
      id: slic_score
      save_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/slic/score

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: ck_{epoch:02d}
        auto_insert_metric_name: false

model:
  class_path: train.experimental.slic.task.ScoreTask
  init_args:
    net:
      class_path: train.experimental.slic.score_net.ScoreNet
      init_args:
        nf: 16
        ch_mult: [4, 4, 2, 2, 2, 1, 1, 1]
        res_mult: [2, 2, 2, 4, 4, 4, 4]
        num_res_blocks: 2
        dropout: 0.1
        fir_kernel: [1, 3, 1]
        init_scale: 0.01
        fourier_scale: 16.0
        sigma_min: 0.001
        sigma_max: 10000.0
        num_channels: 1
    learning_rate: 2e-5
    weight_decay: 0.0
    ema_rate: 0.999
    max_grad_norm: 1.0

data:
  class_path: train.data.supervised.DenoiserOnlyAframeDataset
  init_args:
    background_dir: /home/kyoon/SSM-BNS/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /home/kyoon/SSM-BNS/DATA/aframe/train
    test_background_dir: /home/kyoon/SSM-BNS/DATA/O3b_H1_L1_2048Hz
    ifos: [H1, L1]
    sample_rate: 2048.0

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 32
    batches_per_epoch: 1564
    val_batches: 64
    chunk_size: 2000
    chunks_per_epoch: 25
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20.0

    waveform_prob: 1.0
    signal_repeats: 1
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 4
    persistent_workers: true

    num_valid_views: 4
    valid_stride: 25.0
    valid_livetime: 210000.0

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    val_snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    param_transforms:
      - class_path: train.transforms.ChirpMass
      - class_path: train.transforms.MassRatio

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        training_waveform_path: /home/kyoon/SSM-BNS/DATA/aframe/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5
        val_waveform_file: /home/kyoon/SSM-BNS/DATA/aframe/val/end_o3_ratesandpops_bns_snr4.hdf5
        num_val_waveforms: 8192

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
