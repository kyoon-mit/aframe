# Next-sample noise model: causal S4D (d_model 64, d_state 32, 4 layers,
# dropout 0, dt 1e-4 to 10, as oracle/sig_only_reg_s4d_dropout0_64x32x4.yaml)
# predicting each whitened sample from the earlier ones as a scale mixture of
# 3 Gaussians with one shared mean. The network reads asinh of the earlier
# samples (loud glitches overflowed float32 without it). LayerNorm per sample in place of that
# config's group norm, which averages over time. Loss: minus the mean
# log-likelihood per sample. Optimizer and schedule as that config. Data
# section copied verbatim from slic/score.yaml (noise-only windows, H1 and L1
# as separate examples).
#
# python -m train.experimental.next_sample fit --config k3_shared_mean_asinh.yaml

seed_everything: 20261006

trainer:
  max_epochs: 800
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true

  default_root_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/next_sample/k3_shared_mean_asinh

  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: CLAUDE-TESTS
      name: next_sample_k3_shared_mean_asinh
      id: next_sample_k3_shared_mean_asinh
      save_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/next_sample/k3_shared_mean_asinh

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: ck_{epoch:02d}
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: train.callbacks.ResumableEarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 80
        cycle_aware: true
        verbose: true

model:
  class_path: train.experimental.next_sample.task.NextSampleTask
  init_args:
    arch:
      class_path: train.experimental.next_sample.arch.CausalS4Noise
      init_args:
        num_components: 3
        d_model: 64
        d_state: 32
        n_layers: 4
        dropout: 0.0
        dt_min: 0.0001
        dt_max: 10.0
    learning_rate: 1e-4
    ssm_lr: 1e-3
    weight_decay: 0.01
    lr_scheduler:
      class_path: train.model.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 10
        T_0: 40
        T_mult: 2
        eta_min: 1e-7
        warmup_start_factor: 0.01
        peak_decay: 0.9

data:
  class_path: train.data.supervised.DenoiserOnlyAframeDataset
  init_args:
    background_dir: /home/kyoon/SSM-BNS/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /home/kyoon/SSM-BNS/DATA/aframe/train
    test_background_dir: /home/kyoon/SSM-BNS/DATA/O3b_H1_L1_2048Hz
    ifos: [H1, L1]
    sample_rate: 2048.0

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 32
    batches_per_epoch: 1564
    val_batches: 64
    chunk_size: 2000
    chunks_per_epoch: 25
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20.0

    waveform_prob: 1.0
    signal_repeats: 1
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 4
    persistent_workers: true

    num_valid_views: 4
    valid_stride: 25.0
    valid_livetime: 210000.0

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    val_snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    param_transforms:
      - class_path: train.transforms.ChirpMass
      - class_path: train.transforms.MassRatio

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        training_waveform_path: /home/kyoon/SSM-BNS/DATA/aframe/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5
        val_waveform_file: /home/kyoon/SSM-BNS/DATA/aframe/val/end_o3_ratesandpops_bns_snr4.hdf5
        num_val_waveforms: 8192

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
