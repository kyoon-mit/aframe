# Chirp-kernel network: 512 Newtonian chirp kernels with learned chirp
# masses, energy summed over detectors and phases, maximum over time, softmax
# over the kernels' chirp masses, cross-entropy. No mean pooling.

seed_everything: 20261006

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true

  default_root_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/chirp_kernel_512_learned_mc_softmax_train_snr8_prob0.96

  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: CLAUDE-TESTS
      name: chirp_kernel_512_learned_mc_softmax_train_snr8_prob0.96
      id: chirp_kernel_512_learned_mc_softmax_train_snr8_prob0.96
      save_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/claude_tests/chirp_kernel_512_learned_mc_softmax_train_snr8_prob0.96

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/within_2pct_chirp_mass
        mode: max
        save_top_k: 1
        save_last: true
        filename: ck_{epoch:02d}
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  class_path: train.experimental.chirp_kernel.task.ChirpKernelClassifier
  init_args:
    arch:
      class_path: train.experimental.chirp_kernel.arch.ChirpKernelNet
      init_args:
        num_ifos: 2
        n_kernels: 512
        mc_min: 0.85
        mc_max: 2.75
        sample_rate: 2048.0
        f_low: 20.0
        f_high: 800.0
        learn_chirp_mass: true

    label_width: 0.5
    learning_rate: 1e-3
    # the kernels' log chirp masses use this rate, without weight decay
    ssm_lr: 1e-4
    weight_decay: 0.01
    normalize_input: false
    predict_residual: false
    log_grad_every: 0

    lr_scheduler:
      class_path: train.model.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 2
        T_0: 20
        T_mult: 2
        eta_min: 1e-6
        warmup_start_factor: 0.1
        peak_decay: 0.9
    lr_scheduler_interval: epoch

data:
  class_path: train.data.supervised.DenoiserOnlyAframeDataset
  init_args:
    background_dir: /home/kyoon/SSM-BNS/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /home/kyoon/SSM-BNS/DATA/aframe/train
    test_background_dir: /home/kyoon/SSM-BNS/DATA/O3b_H1_L1_2048Hz
    ifos: [H1, L1]
    sample_rate: 2048.0

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 32
    batches_per_epoch: 1564
    val_batches: 16
    chunk_size: 2000
    chunks_per_epoch: 25
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20.0

    waveform_prob: 0.96
    signal_repeats: 4
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 4
    persistent_workers: true

    num_valid_views: 4
    valid_stride: 25.0
    valid_livetime: 210000.0

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 8.0
        end_params:
          minimum: 8.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    val_snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -3
          maximum: 100.0
        start_params:
          minimum: 4.0
        end_params:
          minimum: 4.0
        decay_steps: 1
        distribution: ml4gw.distributions.PowerLaw

    param_transforms:
      - class_path: train.transforms.ChirpMass
      - class_path: train.transforms.MassRatio

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        training_waveform_path: /home/kyoon/SSM-BNS/DATA/aframe/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5
        val_waveform_file: /home/kyoon/SSM-BNS/DATA/aframe/val/end_o3_ratesandpops_bns_snr4.hdf5
        num_val_waveforms: 8192

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
