# Naive baseline for the den_reg run of the same window: the same S4D
# regressor reading the noisy input directly, no denoiser, trained on
# energy from epoch 0.

seed_everything: 20260910

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true


  default_root_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/project8/p8_reg_only_20.3us_403MHz

  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: PROJECT8-DEN-REG
      name: p8_reg_only_20.3us_403MHz
      id: p8_reg_only_20.3us_403MHz
      save_dir: /home/kyoon/SSM-BNS/aframe/dev/runs/project8/p8_reg_only_20.3us_403MHz

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: reg_{epoch:02d}
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch


model:
  class_path: train.experimental.den_reg.task.DenoisedRegressionWithDenoiserMetrics
  init_args:
    arch:
      class_path: train.experimental.project8.arch.RegressionTimeDomainS4Pooled
      init_args:
        num_ifos: 2
        d_output: 2          # energy and its uncertainty
        regressor_d_model: 64
        regressor_d_state: 64
        regressor_n_layers: 4
        regressor_dropout: 0.2
        prenorm: true
        num_groups: 32
        dt_min: 1e-4
        dt_max: 10.0

    param_names:
      - energy_eV
    beta_nll: 0.3
    y_mean: [18549.91]
    y_std: [28.83]
    lambda_spread: 0.2
    within_thresholds: [20, 10, 5, 2, 1]
    within_unit: eV

    learning_rate: 1e-4
    ssm_lr: 1e-3
    weight_decay: 0.01
    normalize_input: false
    log_dt_min: -11.5
    log_dt_max: 2.3
    log_a_max: 4.6

    # no denoiser to train: the regressor carries the whole loss from epoch 0
    lambda_denoise: 0.0
    lambda_regress: 1.0
    regress_schedule:
      - [0, 1.0]

    denoiser_loss:
      class_path: train.losses_denoiser_ky.ScheduledMixtureLoss
      init_args:
        alpha: 0.5
        density: false
        time_loss: mse
        spectral_loss: msle
        log_floor: 1.0e-1
        lambda_amp: 1.0
        c_rho: 5.0


    lr_scheduler:
      class_path: train.model.regression_ky.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 10
        T_0: 20
        T_mult: 2
        eta_min: 1e-7
        peak_decay: 0.9
    lr_scheduler_interval: epoch

data:
  class_path: train.experimental.project8.data.Project8DataModule
  init_args:
    data_dir: /home/kyoon/SSM-BNS/DATA/Project8
    noise: cav
    offset: 0
    cutoff: 8192
    batch_size: 128
    num_workers: 4
