# Denoiser and chirp-mass regressor trained together. The denoiser runs
# alone to epoch 200, the regressor is ramped in over the next 200, and
# from 400 the two carry equal weight.
#
# Time MSE + freq msle (log_floor 1e-1) at fixed alpha 0.5, a
# cosine-similarity penalty at 5 and a log-amplitude penalty at 1.
# Training SNR drawn uniformly on [4, 100] instead of the power law;
# validation waveforms are unchanged.

seed_everything: 20260910

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  benchmark: true

  default_root_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/denoise/merger/den_reg_sched_alpha_0.5_floor_1e-1_c_rho_5_lambda_amp_1_uniform_snr

  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: DENOISER-SCAN
      name: den_reg_sched_alpha_0.5_floor_1e-1_c_rho_5_lambda_amp_1_uniform_snr
      id: den_reg_sched_alpha_0.5_floor_1e-1_c_rho_5_lambda_amp_1_uniform_snr
      save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/denoise/merger/den_reg_sched_alpha_0.5_floor_1e-1_c_rho_5_lambda_amp_1_uniform_snr

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/den_loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: den_{epoch:02d}
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: train.callbacks.ReferenceEventCallback
      init_args:
        events_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/data/plot/merger_4s_2048Hz/plot_events.hdf5
        every_n_epochs: 10

model:
  class_path: train.experimental.den_reg.task.DenoisedRegressionWithDenoiserMetrics
  init_args:
    arch:
      class_path: architectures.regression.RegressionTimeDomainS4DenoiseRegressNorm
      init_args:
        num_ifos: 2
        d_output: 2          # chirp mass and its uncertainty
        denoiser_d_model: 64
        denoiser_d_state: 64
        denoiser_n_layers: 4
        denoiser_dropout: 0.2
        regressor_d_model: 64
        regressor_d_state: 64
        regressor_n_layers: 4
        regressor_dropout: 0.2
        prenorm: true
        num_groups: 32
        dt_min: 1e-4
        dt_max: 10.0
        detach_denoiser: false

    param_names:
      - chirp_mass
    beta_nll: 0.3
    y_mean: [1.8]
    y_std: [0.55]
    lambda_spread: 0.2

    learning_rate: 1e-4
    ssm_lr: 1e-3
    weight_decay: 0.01
    normalize_input: false
    log_dt_min: -11.5
    log_dt_max: 2.3
    log_a_max: 4.6

    # denoiser alone to epoch 200, regressor ramped in over the next 200,
    # then the two weighted equally
    lambda_denoise: 1.0
    lambda_regress: 1.0
    regress_schedule:
      - [200, 0.0]
      - [400, 1.0]

    denoiser_loss:
      class_path: train.losses_denoiser_ky.ScheduledMixtureLoss
      init_args:
        alpha: 0.5
        density: false
        time_loss: mse
        spectral_loss: msle
        log_floor: 1.0e-1
        lambda_amp: 1.0
        c_rho: 5.0


    lr_scheduler:
      class_path: train.model.regression_ky.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 10
        T_0: 20
        T_mult: 2
        eta_min: 1e-7
        peak_decay: 0.9
    lr_scheduler_interval: epoch

data:
  class_path: train.data.supervised.DenoiserOnlyAframeDataset
  init_args:
    background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train
    ifos: [H1, L1]
    sample_rate: 2048

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 128
    batches_per_epoch: 391
    val_batches: 4
    chunk_size: 2000
    chunks_per_epoch: 25
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20

    # every row carries signal: this is a denoiser, not a detector
    waveform_prob: 1.0
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 8
    persistent_workers: true

    num_valid_views: 4
    valid_stride: 25
    valid_livetime: 210000

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        distribution: torch.distributions.Uniform
        constant_params:
          low: 4.0
          validate_args: false
        start_params:
          high: 100.0
        end_params:
          high: 100.0
        decay_steps: 1

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        num_val_waveforms: 8192
        val_waveform_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/val/end_o3_ratesandpops_bns_snr4.hdf5
        training_waveform_path: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
