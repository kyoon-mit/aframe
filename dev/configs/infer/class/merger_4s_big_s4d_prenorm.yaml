# infer config for the S4D merger_4s CLASSIFICATION model (big S4D prenorm, d256 s32).
# (chirp_mass_snr_4_50_26-30s_d64_s64_l4_regdev_test1, s4d_cls_auroc_1375.ckpt).
#
# The served discriminator is the classifier's single logit (higher = more
# signal-like) -- the ranking statistic directly, no mass/sigma folding.
#
# Geometry is identical to the regression merger_4s run (kernel 4s, 2048 Hz),
# so the snapshotter/preprocessor are reused unchanged: inference_sampling_rate
# 16, batch_size 128, psd_length 20, fduration 1.
#
# background_fname, shifts, and the Triton address are supplied per-task on the
# CLI by the client job (jsonargparse does NOT expand ${VAR} inside YAML).

client:
  model_name: aframe-stream             # the exported ensemble
  model_version: -1
  batch_size: 128
  # address: set on CLI --client.address ${IP}:${GRPC}

data:
  injection_set_fname: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/test/end_o3_ratesandpops_bns_snr4.hdf5
  ifos: [H1, L1]
  inference_sampling_rate: 16
  batch_size: 128
  # triton_address: set on CLI --data.triton_address ${IP}:${GRPC}

postprocessor:
  psd_length: 20.0
  fduration: 1.0
  integration_window_length: 1.0
  cluster_window_length: 0.5
