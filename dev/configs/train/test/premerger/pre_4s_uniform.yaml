# test-time overrides; layer after the run's own config.yaml
trainer:
  logger: false
  callbacks:
    - class_path: train.callbacks.PlotParamEstCallback
      init_args:
        save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/MODEL/aframe/reg-dev-latest/test_csv/premerger/pre_4s_uniform

data:
  test_background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3b_H1_L1_2048Hz
  test_batches: 800
  waveform_prob: 0.5
  snr_sampler:
    class_path: train.augmentations.SnrSampler
    init_args:
      distribution: torch.distributions.Uniform
      constant_params:
        low: 4.0
        high: 50.0
        validate_args: false
      start_params: {}
      end_params: {}
      decay_steps: 1
  waveform_sampler:
    class_path: train.data.waveforms.WaveformLoader
    init_args:
      ifos: [H1, L1]
      sample_rate: 2048
      num_val_waveforms: 8192
      val_waveform_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/val/end_o3_ratesandpops_bns_snr4.hdf5
      training_waveform_path: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/val/end_o3_ratesandpops_bns_snr4.hdf5
