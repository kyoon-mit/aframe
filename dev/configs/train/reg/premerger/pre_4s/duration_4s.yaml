seed_everything: 20260612

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 100000
  check_val_every_n_epoch: 2
  gradient_clip_val: 1.0
  log_every_n_steps: 20
  enable_progress_bar: true
  default_root_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/premerger/pre_4s/duration_4s/train/reg/chirp_mass_22-26s_d64_s64_l4_regdev

  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: chirp_mass_snr_4_50_22-26s_d64_s64_l4_regdev
        id:   chirp_mass_snr_4_50_22-26s_d64_s64_l4_regdev
        save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/premerger/pre_4s/duration_4s/train/reg/chirp_mass_22-26s_d64_s64_l4_regdev
        project: BNS-PUBLICATION

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse_chirp_mass
        mode: min
        every_n_epochs: 2
        save_top_k: 3
        save_last: true
        filename: 's4d_chirp_mass_mse_{epoch:02d}'
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 100000
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  class_path: train.model.regression_ky.GaussianNLLRegressionAframeCustomLR
  init_args:
    arch:
      class_path: architectures.supervised.SupervisedS4Model
      init_args:
        num_ifos: 2
        d_output: 2          # chirp_mass mean + variance
        d_model: 64
        d_state: 64
        n_layers: 4
        dropout: 0.2
        dt_min: 1.0e-3
        dt_max: 5.0          # match the warm-start ckpt's init range
    param_names:
      - chirp_mass
    beta_nll: 0.3
    y_mean: [1.80]
    y_std: [0.55]
    # test4 (lr 3e-4, restarts) destabilized after ~epoch 99; test5
    # fine-tunes test4's best ckpt gently with no restart in-window
    learning_rate: 1e-4   # non-SSM parameters
    ssm_lr: 1e-4
    normalize_input: true
    warm_start_ckpt: null
    lambda_spread: 0.2    # 0.3 spent the window-length info gain on spread; buy back mse
    weight_decay: 0.01
    lr_scheduler:
      class_path: train.model.regression_ky.WarmupCosineAnnealingWarmRestarts
      init_args:
        # anneal fully within the 12h wall time so the run
        # consolidates instead of oscillating at full lr
        warmup_epochs: 1
        T_0: 140
        T_mult: 2
        eta_min: 1.0e-7
    lr_scheduler_interval: epoch

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train
    ifos: [H1, L1]
    sample_rate: 2048
    model_input_sample_rate: 256

    kernel_length: 4.0
    left_pad: 8.0
    right_pad: -4.5

    batch_size: 128
    batches_per_epoch: 3125   # 50k waveforms per epoch / batch 16
    chunk_size: 2000
    chunks_per_epoch: 25      # 25 x 2000 = 50k draws; full 200k pool every ~4 epochs
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20

    waveform_prob: 1.0
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 8

    num_valid_views: 1
    valid_stride: 25
    valid_livetime: 210000   # 5 shifts at stride 25 -> ~8365 windows to host 8192 val waveforms

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -2
          maximum: 100.0
        start_params:
          minimum: 4.0      # ckpt already snr>=4-adapted; train settled
        end_params:
          minimum: 4.0
        decay_steps: 100

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        num_val_waveforms: 8192
        val_waveform_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/val/end_o3_ratesandpops_bns_snr4.hdf5
        training_waveform_path: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
