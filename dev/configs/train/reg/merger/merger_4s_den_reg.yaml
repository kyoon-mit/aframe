seed_everything: 20260623

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 100000
  check_val_every_n_epoch: 4
  gradient_clip_val: 1.0
  log_every_n_steps: 20
  enable_progress_bar: true
  default_root_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/denoise_regress_4s/train/reg/s4d_denoise_regress_4s

  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: merger_4s_den_reg
        id:   merger_4s_den_reg
        save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/denoise_regress_4s/train/reg/s4d_denoise_regress_4s
        project: BNS-PUBLICATION

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse_chirp_mass
        mode: min
        save_top_k: 3
        save_last: true
        filename: 's4d_chirp_mass_mse_{epoch:02d}'
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse_chirp_mass
        mode: min
        patience: 100000
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  class_path: train.model.regression_ky.DenoisedGaussianNLLRegression
  init_args:
    arch:
      class_path: architectures.regression.RegressionTimeDomainS4DenoiseRegressResNetMLP
      init_args:
        num_ifos: 2
        d_output: 2          # chirp_mass mean + variance
        denoiser_d_model: 128
        denoiser_d_state: 64
        denoiser_n_layers: 6
        denoiser_dropout: 0.0
        regressor_d_model: 128
        regressor_d_state: 64
        regressor_n_layers: 6
        regressor_dropout: 0.0
        regressor_prenorm: false
        resnet_layers: [2, 2, 2]
        resnet_latent_dim: 64
        mlp_width: 64
        mlp_depth: 2
        dt_min: 1.0e-3
        dt_max: 10.0
        detach_denoiser: false
    param_names:
      - chirp_mass
    beta_nll: 0.3
    y_mean: [1.80]
    y_std: [0.55]
    learning_rate: 1e-3   # non-SSM parameters
    ssm_lr: 1e-2
    normalize_input: true
    warm_start_ckpt: null
    lambda_spread: 0.2
    denoiser_loss:
      class_path: train.losses.MixtureMSESpectralLoss
      init_args:
        alpha: 0.5
    lambda_denoise: 300.0  # match scale
    lambda_regress: 1.0
    regress_schedule: [[20, 0.0], [30, 0.5], [90, 0.5], [100, 1.0]]
    weight_decay: 0.01
    lr_scheduler:
      class_path: train.model.regression_ky.WarmupCosineAnnealingWarmRestarts
      init_args:
        # anneal fully within the 12h wall time so the run
        # consolidates instead of oscillating at full lr
        warmup_epochs: 10
        T_0: 200
        T_mult: 2
        eta_min: 1.0e-5
    lr_scheduler_interval: epoch

data:
  class_path: train.data.supervised.DenoisingTimeDomainSupervisedAframeDataset
  init_args:
    background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train
    ifos: [H1, L1]
    sample_rate: 2048

    kernel_length: 4.0
    model_input_sample_rate: 256
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 32
    batches_per_epoch: 256
    chunk_size: 512
    chunks_per_epoch: 16
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20

    waveform_prob: 1.0
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 8

    num_valid_views: 1
    valid_stride: 25
    valid_livetime: 210000   # 5 shifts at stride 25 -> ~8365 windows to host 8192 val waveforms

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -2.5
          maximum: 60.0
        start_params:
          minimum: 20.0      # ckpt already snr>=4-adapted; train settled
        end_params:
          minimum: 4.0
        decay_steps: 512

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        num_val_waveforms: 8192
        val_waveform_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/val/end_o3_ratesandpops_bns_snr4.hdf5
        training_waveform_path: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
