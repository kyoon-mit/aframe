seed_everything: 20260628

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 100000
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  enable_progress_bar: true
  default_root_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/claude_tests/linoss_4s_reg_warmrestart

  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: linoss_4s_reg_test:warm_restart_v2
        id:   linoss_4s_reg_test_warm_restart_v2
        save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/claude_tests/linoss_4s_reg_warmrestart
        project: CLAUDE-TESTS

  callbacks:
    - class_path: train.utils.jax.save_model.JAXCheckpointManager
      init_args:
        monitor: val/mse_chirp_mass
        mode: min
        save_top_k: 1
        save_last: true
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

model:
  class_path: train.model.jax.JaxRegressionAframe
  init_args:
    arch:
      class_path: architectures.regression.RegressionTimeDomainLinOSSResNetMLPDecoder
      init_args:
        num_ifos: 2
        d_output: 2
        d_model: 256
        d_state: 32
        n_layers: 4
        dropout: 0.2
        r_min: 0.9
        theta_max: 3.14159265359
        seed: 0
    param_names:
      - chirp_mass
    beta_nll: 0.3
    y_mean: [1.80]
    y_std: [0.55]
    ssm_lr: 1e-3
    learning_rate: 1e-4
    normalize_input: true
    lambda_spread: 0.2
    weight_decay: 0.01
    clip_grad_norm: 1.0
    warmup_steps: 300
    schedule: warm_restart
    restart_period: 3000
    restart_mult: 2.0
    peak_decay: 0.9
    eta_min_ratio: 0.02
    n_restart_cycles: 8
    seed: 42
