seed_everything: 20260628

trainer:
  accelerator: auto
  devices: auto
  max_epochs: 100000
  check_val_every_n_epoch: 2
  log_every_n_steps: 20
  enable_progress_bar: true
  default_root_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/claude_tests/linoss_4s_reg_wr_prod

  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: linoss_4s_reg_test:wr_prod
        id:   linoss_4s_reg_test_wr_prod
        save_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe/dev/runs/claude_tests/linoss_4s_reg_wr_prod
        project: CLAUDE-TESTS

  callbacks:
    - class_path: train.utils.jax.save_model.JAXCheckpointManager
      init_args:
        monitor: val/mse_chirp_mass
        mode: min
        save_top_k: 3
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse_chirp_mass
        mode: min
        patience: 100000
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  class_path: train.model.jax.JaxRegressionAframe
  init_args:
    arch:
      class_path: architectures.regression.RegressionTimeDomainLinOSSResNetMLPDecoder
      init_args:
        num_ifos: 2
        d_output: 2
        d_model: 256
        d_state: 32
        n_layers: 4
        dropout: 0.2
        r_min: 0.9
        theta_max: 3.14159265359
        seed: 0
    param_names:
      - chirp_mass
    beta_nll: 0.3
    y_mean: [1.80]
    y_std: [0.55]
    ssm_lr: 1e-3
    learning_rate: 1e-4
    normalize_input: true
    max_steps: 500000
    lambda_spread: 0.2
    weight_decay: 0.01
    warmup_steps: 781
    clip_grad_norm: 1.0
    schedule: warm_restart
    restart_period: 109340   # T_0=140 epochs * 781 bpe
    restart_mult: 2
    peak_decay: 0.9
    eta_min_ratio: 1.0e-3   # eta_min 1e-7 / lr 1e-4
    lr_scheduler:
      class_path: train.model.regression_ky.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 1
        T_0: 140
        T_mult: 2
        eta_min: 1.0e-7
        peak_decay: 0.9
    lr_scheduler_interval: epoch

    seed: 42

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3a_H1_L1_2048Hz
    waveforms_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train
    ifos: [H1, L1]
    sample_rate: 2048

    kernel_length: 4.0
    left_pad: 3.5
    right_pad: 0.0

    batch_size: 64
    batches_per_epoch: 781   # ~50k waveforms per epoch
    chunk_size: 2000
    chunks_per_epoch: 25     # 25 x 2000 = 50k draws; full 200k pool every ~4 epochs
    num_files_per_batch: 1

    fduration: 1.0
    fftlength: 2.0
    psd_length: 20.0
    highpass: 20

    waveform_prob: 1.0
    swap_prob: 0.0
    mute_prob: 0.0
    max_num_workers: 8

    num_valid_views: 1
    valid_stride: 25
    valid_livetime: 210000

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        constant_params:
          index: -2
          maximum: 100.0
        start_params:
          minimum: 20.0
        end_params:
          minimum: 4.0
        decay_steps: 8000   # ~10 epochs at bpe 781 (was a too-fast ramp)

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        num_val_waveforms: 8192
        val_waveform_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/val/end_o3_ratesandpops_bns_snr4.hdf5
        training_waveform_path: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false
