[project]
name = "scorer"
version = "0.0.1"
description = "Learned replacement for the aframe integration/scoring step"
authors = [{ name = "Benedict Armstrong" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy~=1.7",
    "h5py~=3.5",
    "tqdm",
    "matplotlib>=3.9.4",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "ledger",
    "priors",
    "utils",
    "plots",
]

[project.scripts]
scorer = "scorer.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0,<9"]

[tool.uv]

[tool.uv.sources]
ledger = { path = "../../libs/ledger", editable = true }
priors = { path = "../../libs/priors", editable = true }
utils = { path = "../../libs/utils", editable = true }
plots = { path = "../plots", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
