# Export config for the S4D 4s-merger SV base repository.
#
# No-compile export (see export_s4d_merger_1s.yaml). Built for the 4s geometry
# (kernel_length=4 -> X is 2x8192) at batch_size=128: the S4D FFT buffers scale
# with batch*seq, so batch 512 at L=8192 OOMs the GPU. batch_size must be set
# here (re-export), NOT via make_sv_run --batch-size, because the snapshotter /
# preprocessor bake in batch_size*stride (e.g. the snapshotter stream input).
#
# Preprocessor params mirror the 4s training config
# (projects/train/configs/regression/s4d/merger_4s_finetune.yaml):
# fduration=2, fftlength=2, highpass=20, sample_rate=2048.

num_ifos: 2
kernel_length: 4.0
inference_sampling_rate: 16
sample_rate: 2048
batch_size: 128
fduration: 2
psd_length: 64
preprocessor:
  class_path: utils.preprocessing.BatchWhitener
  init_args:
    kernel_length: 4.0
    sample_rate: 2048
    inference_sampling_rate: 16
    batch_size: 128
    fduration: 2
    fftlength: 2
    highpass: 20
streams_per_gpu: 6
preproc_instances: 3
num_outputs: 1
clean: true
verbose: true
