model:
  class_path: train.model.TrueHeterodyneAframe
  init_args:
    chirp_mass_perturbation: 0.1
    arch:
      class_path: architectures.supervised.SupervisedTimeDomainResNet
      init_args:
        num_ifos: 2 # H1, L1
        sample_rate: 2048
        kernel_length: 4.0
        layers: [3, 4, 6, 3]
        kernel_size: 21
        norm_layer:
          class_path: ml4gw.nn.norm.GroupNorm1DGetter
          init_args:
            groups: 16

    # heterodyne args: must match the data sample_rate / kernel_length
    sample_rate: 2048
    kernel_length: 4.0
    # pool of chirp masses sampled for background segments (no true mass)
    background_chirp_mass_file: data/bns/uniform_chirp_mass_waveforms/training_waveforms.hdf5
    min_chirp_mass: 0.1

    # optimization params
    learning_rate: 4e-4
    pct_lr_ramp: 0.115
    weight_decay: 3e-5

    metric:
      class_path: train.metrics.TimeSlideAUROC
      init_args:
        max_fpr: 1e-3
        pool_length: 8

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: data/bns/background_data
    waveforms_dir: data/bns/aframe_train/
    ifos: [H1, L1]

    sample_rate: 2048
    windowing:
      kernel_length: 4.0
      window_lead_min: 0
      window_lead_max: 0.25

    batch_size: 256
    batches_per_epoch: 1000
    chunk_size: 10000
    chunks_per_epoch: 10
    num_files_per_batch: 4

    fduration: 2.0
    fftlength: 2.0
    psd_length: 20
    highpass: 20
    waveform_prob: 0.277
    max_num_workers: 16
    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        distribution: ml4gw.distributions.PowerLaw
        constant_params:
          maximum: 50
        start_params:
          minimum: 10
          index: -2
        end_params:
          minimum: 4
          index: -3
        decay_steps: 5000

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: data/bns/uniform_chirp_mass_waveforms/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 6.28318
        validate_args: false

trainer:
  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "aframe_resnet_true_heterodyne_4s_merger"
        save_dir: outputs
        project: "aframe"
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        # TimeSlideAUROC is higher-is-better.
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "max"
        patience: 50
    - class_path: train.callbacks.ModelCheckpoint
      init_args:
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "max"
        save_top_k: 3
        save_last: true
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: train.metric.plotting.SnrVsScoreScatterCallback

  strategy: auto
  devices: auto

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 25
  enable_progress_bar: true
