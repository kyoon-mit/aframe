# OriginalLinOSS (JAX/Equinox) binary-classification config.
#
# Detection-statistic classifier using the JAX OriginalLinOSS architecture
# (single logit) via JaxClassificationAframe.
#
# OriginalLinOSS is a faithful port of discretax's plain LinOSS model (linear
# encoder + stacked LinOSS StandardBlock blocks + MLP head) using the
# generalized real-pair LinOSS sequence mixer (discretax PR #74: IM/IMEX/
# IMEX2/IMEX3/EX, AG/RT init, stability projection, multi-head, input
# normalization). Unlike LinOSS/LinOSS2 there is no
# pooling backbone and no intermediate ResNet.
model:
  class_path: train.model.jax.JaxClassificationAframe
  init_args:
    load_from_checkpoint: /home/barmstrong/aframe_official/projects/train/outputs/aframe/bbwrbwsx/checkpoints/checkpoint_step_14000_metric_0.506260097026825.eqx
    arch:
      class_path: architectures.supervised.SupervisedTimeDomainOriginalLinOSS
      init_args:
        time_in_features: 2 # H1, L1
        time_hidden_dim: 64
        time_num_blocks: 3
        time_dropout_rate: 0
        time_state_dim: 64
        time_r_min: 0.9
        time_theta_max: 3.14159265359
        # OriginalLinOSS sequence-mixer options (discretax PR #74)
        time_discretization: IMEX2 # IM | IMEX | IMEX2 | IMEX3 | EX
        # RT init samples eigenvalues in the (r_min..1, 0..theta_max) annulus,
        # so time_r_min / time_theta_max above are used by RT (AG ignores them
        # and instead samples A/G uniformly up to A_max / G_max).
        time_initialization: RT # AG | RT
        time_damping: true
        time_stability: oscillatory # oscillatory | stable
        time_projection_eps: 0.001 # stability margin inset from Jury boundary
        time_input_normalization: true # LRU-style init gain; requires damping
        time_num_heads: 4
        time_use_head_output_projection: true
        time_A_max: 1.0 # AG init only
        time_G_max: 1.0 # AG init only
        time_prenorm: true
        dtype: float32
        mlp_width: 64
        mlp_depth: 3
        d_output: 1 # single classification logit
        seed: 0

    learning_rate: 5e-4
    weight_decay: 0.01
    warmup_steps: 1000
    max_steps: 3000000
    clip_grad_norm: 1000.0
    seed: 42
    metric:
      class_path: train.metrics.TimeSlideAUROC
      init_args:
        max_fpr: 1e-3
        pool_length: 8

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: data/bns/background_data
    waveforms_dir: data/bns/aframe_train/
    ifos: [H1, L1]

    sample_rate: 2048
    windowing:
      kernel_length: 4.0
      window_lead_min: -0.25
      window_lead_max: 1.75

    batch_size: 256
    batches_per_epoch: 1000
    chunk_size: 10000
    chunks_per_epoch: 10
    num_files_per_batch: 4

    fduration: 2.0
    fftlength: 2.0
    psd_length: 20
    highpass: 20
    waveform_prob: 0.277
    swap_prob: 0.014
    mute_prob: 0.055
    max_num_workers: 16
    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        distribution: ml4gw.distributions.PowerLaw
        constant_params:
          maximum: 50
        start_params:
          minimum: 8
          index: -3
        end_params:
          minimum: 8
          index: -3
        decay_steps: 10000

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: data/bns/uniform_chirp_mass_waveforms/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 6.28318
        validate_args: false

trainer:
  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "aframe_original_linoss_classification_4s_merger"
        save_dir: outputs
        project: "aframe"
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        # TimeSlideAUROC is higher-is-better.
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "max"
        patience: 50
    # equinox-aware checkpointer; the default ModelCheckpoint cannot
    # serialise the JAX/equinox model living on the LightningModule.
    - class_path: train.utils.jax.save_model.JAXCheckpointManager
      init_args:
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "max"
        save_top_k: 3
        warmup_steps: 1000

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: train.metric.plotting.SnrVsScoreScatterCallback

  strategy: auto
  devices: auto

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 25
  enable_progress_bar: true
