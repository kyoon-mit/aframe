# LinOSS2 (JAX/Equinox) chirp-mass regression config.
#
# Same objective as configs/regression/regression.yaml (predict chirp_mass
# from whitened strain) but using the generalized JAX LinOSS2 architecture
# (multi-head, IM/IMEX/IMEX2/IMEX3/EX discretizations, AG/RT init, stability
# projection) with a GaussianNLL (BetaNLL) + spread objective via
# JaxRegressionAframe.
#
# Key points (mirroring linoss/4s_merger.yaml):
#   - waveform_prob: 1.0  (every sample is injected)
#   - ChirpMass param transform supplies the regression target
#   - d_output: 2  (chirp_mass mean + pre-Softplus log-variance)
#
# NOTE: LinOSS2 has a different parameter layout than LinOSS, so the LinOSS
# checkpoint is not loaded here. Set `load_from_checkpoint` to a LinOSS2
# checkpoint to resume/fine-tune.
seed_everything: 42
model:
  class_path: train.model.jax.JaxRegressionAframe
  init_args:
    load_from_checkpoint: "/home/barmstrong/aframe_official/projects/train/outputs/aframe/y3ez4n69/checkpoints/checkpoint_step_221000_metric_0.5174694061279297.eqx"
    arch:
      class_path: architectures.regression.RegressionTimeDomainLinOSS2
      init_args:
        num_ifos: 2 # H1, L1
        sample_rate: 2048
        kernel_length: 4.0
        time_in_features: 2 # H1, L1
        time_hidden_dim: 64
        time_num_blocks: 3
        time_dropout_rate: 0
        time_state_dim: 64
        time_r_min: 0.9
        time_theta_max: 3.14159265359
        time_num_res_blocks: 1
        time_conv_kernel_size: 4
        time_conv_position: pre
        # LinOSS2 sequence-mixer options
        time_discretization: IMEX2 # IM | IMEX | IMEX2 | IMEX3 | EX
        # RT init samples eigenvalues in the (r_min..1, 0..theta_max) annulus,
        # so time_r_min / time_theta_max above are actually used (AG ignores
        # them and instead samples A/G uniformly up to A_max / G_max).
        time_initialization: RT # AG | RT
        time_damping: true
        time_stability: oscillatory # oscillatory | stable
        time_projection_eps: 1e-3 # stability margin inset from Jury boundary
        time_input_normalization: true # LRU-style init gain; requires damping=true
        time_num_heads: 4
        time_use_head_output_projection: true
        time_A_max: 1.0 # AG init only
        time_G_max: 1.0 # AG init only
        dtype: float32
        resnet_layers: [2, 2]
        resnet_latent_dim: 64
        resnet_kernel_size: 7
        resnet_norm_groups: 16
        mlp_width: 64
        mlp_depth: 2
        d_output: 2 # chirp_mass mean + pre-Softplus log-var
        seed: 0
    d_output: 2 # chirp_mass mean + pre-Softplus log-var
    normalize_input: true
    y_mean: [1.2] # centre of BNS chirp_mass prior [0.87, 2.22]
    y_std: [0.35] # approx std of uniform [0.87, 2.22]
    learning_rate: 1e-4
    weight_decay: 0.01
    warmup_steps: 1000
    max_steps: 3000000
    clip_grad_norm: 100.0
    beta_nll: 0.3
    lambda_spread: 0.0
    seed: 42
    metric:
      class_path: train.metrics.TimeSlideAUROC
      init_args:
        max_fpr: 1e-3
        pool_length: 8

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: data/bns/background_data
    waveforms_dir: data/bns/aframe_train/
    ifos: [H1, L1]

    sample_rate: 2048
    windowing:
      kernel_length: 1.0
      window_lead_min: 0
      window_lead_max: 0.5

    batch_size: 256
    batches_per_epoch: 1000
    chunk_size: 10000
    chunks_per_epoch: 10
    num_files_per_batch: 4

    fduration: 2.0
    fftlength: 2.0
    psd_length: 20
    highpass: 20
    waveform_prob: 1.0
    max_num_workers: 16
    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        distribution: ml4gw.distributions.PowerLaw
        constant_params:
          maximum: 50
        start_params:
          minimum: 8
          index: -3
        end_params:
          minimum: 8
          index: -3
        decay_steps: 10000

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: data/bns/uniform_chirp_mass_waveforms/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 6.28318
        validate_args: false

trainer:
  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "aframe_linoss2_regression_1s_merger"
        save_dir: outputs
        project: "aframe"
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        # GaussianNLL validation objective; lower is better.
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "max"
        patience: 100
    # equinox-aware checkpointer; the default ModelCheckpoint cannot
    # serialise the JAX/equinox model living on the LightningModule.
    - class_path: train.utils.jax.save_model.JAXCheckpointManager
      init_args:
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "max"
        save_top_k: 5
        warmup_steps: 1000

    - class_path: train.metric.plotting.SnrVsScoreScatterCallback

    - class_path: train.metric.plotting.ChirpMassErrorVsSnrCallback

    - class_path: train.metric.plotting.TrueVsPredictedScatterCallback

  strategy: auto
  devices: auto

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 25
  enable_progress_bar: true
