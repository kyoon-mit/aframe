model:
  class_path: train.model.regression_kevin.RegressionAframe
  init_args:
    arch:
      class_path: architectures.RegressionTimeDomainResNet
      init_args:
        layers: [3, 4, 6, 3]
        # Must equal d_output below
        num_params: 2 # chirp_mass mean + pre-Softplus log-var
        kernel_size: 21
        norm_layer:
          class_path: ml4gw.nn.norm.GroupNorm1DGetter
          init_args:
            groups: 16
    d_output: 2 # must match arch d_output
    learning_rate: 1.0e-4
    weight_decay: 0.01
    beta_nll: 0.3
    lambda_spread: 0.3
    metric:
      class_path: train.metrics.TimeSlideAUROC
      init_args:
        max_fpr: 1e-3
        pool_length: 8

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: data/bns/background_data
    waveforms_dir: data/bns/aframe_train/
    ifos: [H1, L1]
    sample_rate: 2048

    windowing:
      kernel_length: 4.0
      window_lead_min: 0
      window_lead_max: 0.25

    batch_size: 256
    batches_per_epoch: 1000
    chunk_size: 10000
    chunks_per_epoch: 10
    num_files_per_batch: 4

    fduration: 1.0
    psd_length: 20
    fftlength: 2.0
    highpass: 20

    # Inject into every sample so the regression loss is never sparse.
    waveform_prob: 1.0
    max_num_workers: 16

    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        distribution: torch.distributions.Uniform
        constant_params:
          high: 50
        start_params:
          low: 4
        end_params:
          low: 4
        decay_steps: 10000

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: data/bns/uniform_chirp_mass_waveforms/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 6.28318
        validate_args: false

trainer:
  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "resnet_merger_4s"
        save_dir: outputs
        project: "aframe"

  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        # Monitor the first param's MAE; adjust to taste.
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "min"
        patience: 50
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "min"
        save_top_k: 1
        save_last: true
        auto_insert_metric_name: false
    - class_path: train.callbacks.SaveAugmentedBatch
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: train.metric.plotting.ChirpMassErrorVsSnrCallback
    - class_path: train.metric.plotting.TrueVsPredictedScatterCallback

  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
