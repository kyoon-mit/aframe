trainer:
  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "s4d_merger_4s_finetune"
        save_dir: outputs
        project: "aframe"

  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        # Monitor the first param's MAE; adjust to taste.
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "min"
        patience: 50
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "min"
        save_top_k: 1
        save_last: true
        auto_insert_metric_name: false
    - class_path: train.callbacks.SaveAugmentedBatch
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
