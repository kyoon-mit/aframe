model:
  class_path: train.model.regression_kevin.RegressionAframeS4D
  init_args:
    # Warm-start the architecture from the pretrained merger_1s weights.
    weights: /fast/barmstrong/kevin_ckpts/new_4s_merger_model/s4d_chirp_mass_mse_4023_model.pt
    arch:
      class_path: architectures.networks.s4d.S4Model
      init_args:
        d_input: 2 # H1, L1
        d_output: 2 # chirp_mass mean + log-var
        d_model: 64
        d_state: 64
        n_layers: 4
        dropout: 0.2
        dt_min: 1.0e-3
        dt_max: 5.0
        lr: 2.0e-4 # SSM parameter learning rate
    d_output: 2 # must match arch d_output
    normalize_input: true
    y_mean: [1.2] # centre of BNS chirp_mass prior [0.87, 2.22]
    y_std: [0.39] # from merger_1s checkpoint
    base_lr: 1.0e-5
    weight_decay: 0.01
    beta_nll: 0.3
    lambda_spread: 0.0
    lr_scheduler:
      class_path: train.model.regression_kevin.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 8
        T_0: 10
        T_mult: 2
        eta_min: 1.0e-7
        warmup_start_factor: 1.0e-2
    lr_scheduler_interval: epoch
    metric:
      class_path: train.metrics.TimeSlideAUROC
      init_args:
        max_fpr: 1e-3
        pool_length: 8

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: data/bns/background_data
    waveforms_dir: data/bns/aframe_train/
    ifos: [H1, L1]
    sample_rate: 2048

    windowing:
      kernel_length: 4.0
      window_lead_min: 0
      window_lead_max: 0.5

    batch_size: 256
    batches_per_epoch: 1000
    chunk_size: 10000
    chunks_per_epoch: 10
    num_files_per_batch: 4

    fduration: 2.0
    fftlength: 2.0
    psd_length: 20
    highpass: 20

    # Inject into every sample so the regression loss is never sparse.
    waveform_prob: 1.0
    max_num_workers: 16

    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        distribution: ml4gw.distributions.PowerLaw
        constant_params:
          maximum: 50
        start_params:
          minimum: 8
          index: -3
        end_params:
          minimum: 4
          index: -3
        decay_steps: 15000

    param_transforms:
      - class_path: train.transforms.ChirpMass

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: data/bns/uniform_chirp_mass_waveforms/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 6.28318
        validate_args: false

trainer:
  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "s4d_merger_4s_finetune"
        save_dir: outputs
        project: "aframe"

  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        # Monitor the first param's MAE; adjust to taste.
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "min"
        patience: 100
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "validation/TimeSlideAUROC_epoch"
        mode: "min"
        save_top_k: 1
        save_last: true
        auto_insert_metric_name: false
    - class_path: train.callbacks.SaveAugmentedBatch
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: train.metric.plotting.ChirpMassErrorVsSnrCallback
    - class_path: train.metric.plotting.TrueVsPredictedScatterCallback

  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true
