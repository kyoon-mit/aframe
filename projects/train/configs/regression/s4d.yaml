model:
  class_path: train.model.RegressionAframeS4D
  init_args:
    arch:
      class_path: architectures.networks.s4d.S4Model
      init_args:
        d_input: 2 # H1, L1
        d_output: 2 # chirp_mass mean + log-var
        d_model: 64
        d_state: 64
        n_layers: 4
        dropout: 0.2
        dt_min: 1.0e-3
        dt_max: 5.0
        lr: 1.0e-3 # SSM parameter learning rate
    d_output: 2 # must match arch d_output
    normalize_input: true
    y_mean: [1.2] # centre of BNS chirp_mass prior [0.87, 2.22]
    y_std: [0.35] # approx std of uniform [0.87, 2.22]
    base_lr: 1e-4
    weight_decay: 0.0
    warmup_steps: 1000
    beta_nll: 0.3
    lambda_spread: 0.3

data:
  class_path: train.data.supervised.TimeDomainRegressionDataset
  init_args:
    background_dir: /home/barmstrong/aframe_new/data/bns/background_data
    waveforms_dir: /home/barmstrong/aframe_new/data/bns/aframe_train/
    ifos: [H1, L1]
    sample_rate: 2048
    kernel_length: 4.0
    fduration: 2.0
    fftlength: 2.0
    psd_length: 20
    highpass: 20
    lowpass: 1024
    batch_size: 128
    batches_per_epoch: 200
    num_files_per_batch: 1
    chunk_size: 10000
    chunks_per_epoch: 10
    waveform_prob: 1.0
    swap_prob: 0
    mute_prob: 0
    left_pad: 3.75390625
    right_pad: 0.00390625
    max_num_workers: 16
    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    # regression-specific
    target_parameters: [chirp_mass]
    n_val_waveforms: 4096

    snr_sampler:
      class_path: ml4gw.distributions.PowerLaw
      init_args:
        minimum: 8
        maximum: 100
        index: -3

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: /home/barmstrong/aframe_new/data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: /home/barmstrong/aframe_new/data/bns/aframe_train/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14159
        high: 3.14159
        validate_args: false

trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_progress_bar: true

  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "aframe_regression"
        save_dir: out
        project: "aframe_regression"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        save_last: true
        filename: "bns_regression_gaussnll_{epoch:02d}"
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 3
        filename: "bns_regression_mse_{epoch:02d}"
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        mode: min
        patience: 20
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

