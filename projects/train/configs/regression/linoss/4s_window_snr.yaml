# LinOSS (JAX/Equinox) window-SNR regression config.
#
# Identical architecture/data setup to configs/regression/linoss/4s_merger.yaml
# but the regression target is `window_snr` (the SNR of only the portion of the
# signal that lands inside the injected kernel) instead of chirp mass.
#
# The training target (`window_snr`) is computed per-batch in
# `SupervisedAframeDataset.inject`. It is *not* computed on the validation path,
# so validation falls back to the full-waveform `snr` via `val_target_param`.
#
# Key points:
#   - waveform_prob: 1.0  (every sample is injected)
#   - target_param: window_snr  (training regression target)
#   - val_target_param: snr     (validation proxy target)
#   - d_output: 2  (window_snr mean + pre-Softplus log-variance)
model:
  class_path: train.model.jax.JaxRegressionAframe
  init_args:
    arch:
      class_path: architectures.regression.RegressionTimeDomainLinOSS
      init_args:
        num_ifos: 2 # H1, L1
        sample_rate: 2048
        kernel_length: 4.0
        time_in_features: 2 # H1, L1
        time_hidden_dim: 32
        time_num_blocks: 3
        time_dropout_rate: 0.1
        time_state_dim: 32
        time_r_min: 0.9
        time_theta_max: 3.14159265359
        time_num_res_blocks: 1
        time_conv_kernel_size: 4
        time_conv_position: pre
        resnet_layers: [2, 2, 2]
        resnet_latent_dim: 64
        resnet_kernel_size: 7
        resnet_norm_groups: 16
        mlp_width: 128
        mlp_depth: 2
        d_output: 2 # window_snr mean + pre-Softplus log-var
        seed: 0
    d_output: 2 # window_snr mean + pre-Softplus log-var
    normalize_input: true
    target_param: window_snr # training regression target
    val_target_param: snr # validation proxy (window_snr not on val path)
    y_mean: [50.0] # centre of SNR prior Uniform(4, 100)
    y_std: [28.0] # approx std of uniform(4, 100): (100-4)/sqrt(12)
    learning_rate: 1e-4
    weight_decay: 0.01
    warmup_steps: 1000
    max_steps: 3000000
    clip_grad_norm: 10.0
    beta_nll: 0.3
    lambda_spread: 0.0
    seed: 42
    metric:
      class_path: train.metrics.TimeSlideAUROC
      init_args:
        max_fpr: 1e-3
        pool_length: 8

data:
  class_path: train.data.supervised.TimeDomainSupervisedAframeDataset
  init_args:
    background_dir: data/bns/background_data
    waveforms_dir: data/bns/aframe_train/
    ifos: [H1, L1]

    sample_rate: 2048
    windowing:
      kernel_length: 2.0
      window_lead_min: -3
      window_lead_max: 0.25

    batch_size: 256
    batches_per_epoch: 1000
    chunk_size: 10000
    chunks_per_epoch: 10
    num_files_per_batch: 4

    fduration: 2.0
    fftlength: 2.0
    psd_length: 20
    highpass: 20
    waveform_prob: 1.0
    max_num_workers: 16
    valid_stride: 0.5
    num_valid_views: 5
    valid_livetime: 57600

    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        distribution: ml4gw.distributions.PowerLaw
        constant_params:
          maximum: 50
        start_params:
          minimum: 15
          index: -1
        end_params:
          minimum: 8
          index: -3
        decay_steps: 10000

    waveform_sampler:
      class_path: train.data.waveforms.WaveformLoader
      init_args:
        ifos: [H1, L1]
        sample_rate: 2048
        val_waveform_file: data/bns/aframe_train/val_waveforms.hdf5
        training_waveform_path: data/bns/uniform_chirp_mass_waveforms/training_waveforms.hdf5

    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 6.28318
        validate_args: false

trainer:
  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: "aframe_linoss_regression_4s_window_snr"
        save_dir: outputs
        project: "aframe"
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        # GaussianNLL validation objective; lower is better.
        monitor: "validation/gaussnll"
        mode: "min"
        patience: 50
    # equinox-aware checkpointer; the default ModelCheckpoint cannot
    # serialise the JAX/equinox model living on the LightningModule.
    - class_path: train.utils.jax.save_model.JAXCheckpointManager
      init_args:
        monitor: "validation/gaussnll"
        mode: "min"
        save_top_k: 3
        warmup_steps: 1000

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: train.metric.plotting.SnrVsScoreScatterCallback

    - class_path: train.metric.plotting.ChirpMassErrorVsSnrCallback

    - class_path: train.metric.plotting.TrueVsPredictedScatterCallback

  strategy: auto
  devices: auto

  max_epochs: 3000
  min_epochs: 60
  check_val_every_n_epoch: 1
  log_every_n_steps: 25
  enable_progress_bar: true
