# 1-WEEK TRIAL inference config for the PRE-MERGER model:
#   aframe_linoss run  chirp_mass_snr_4_50_59-60s_d64_s64_l4_id11
#   checkpoint         s4d_chirp_mass_mse_927.ckpt
#
# Geometry matches training chirp_mass_1s_d64_s64_l4.yaml (256 Hz, 1 s kernel,
# pre-merger window ~3 s before coalescence). Two fixes are active:
#   1. clustering polarity: regression_infer.py returns -sigma (no post-hoc negate).
#   2. pre-merger recovery: window_offset=3.0 shifts foreground detection times to the
#      predicted merger time so recover() matches the confident pre-merger trigger.

checkpoint: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe_linoss/projects/train/logs/aframe/chirp_mass_snr_4_50_59-60s_d64_s64_l4_id11/checkpoints/s4d_chirp_mass_mse_927.ckpt
model_class: LitS4DGaussianNLL

background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3a_H1_L1_4096Hz
injection_set_fname: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe_linoss/runs/regression_sv/bns_injections/waveforms.hdf5

ifos: [H1, L1]

# 4 shifts x 1.64 days = ~6.6 days background (FAR floor ~55/yr) — trial only
shifts:
  - [0, 1]
  - [0, 2]
  - [0, 3]
  - [0, 4]

# Signal properties — must match training (chirp_mass_1s_d64_s64_l4.yaml)
sample_rate: 256          # model rate
raw_sample_rate: 4096     # background files are 4096 Hz -> resampled to 256
kernel_length: 1.0
fduration: 1.0
psd_length: 20.0
fftlength: 2.0
highpass: 20.0

inference_sampling_rate: 8.0
integration_window_length: 1.0
cluster_window_length: 0.5
window_offset: 3.0        # pre-merger: trigger ~3 s before coalescence (matches training)

batch_size: 256
device: cuda
outdir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe_linoss/runs/regression_sv/premerger_1s_id11_1wk/
