seed_everything: 20260603
ckpt_path: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe_linoss/projects/train/logs/aframe/chirp_mass_snr_4_50_59-60s_d64_s64_l4_id11_ckpt1/checkpoints/latest_epoch=1851.ckpt

# =========================
# Trainer
# =========================
trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null

  max_epochs: 20000
  min_epochs: 100
  check_val_every_n_epoch: 4
  log_every_n_steps: 20
  enable_progress_bar: true

  logger:
    - class_path: train.callbacks.AframeWandbLogger
      init_args:
        name: chirp_mass_snr_4_50_59-60s_d64_s64_l4_id11_ckpt1_ft
        id:   chirp_mass_snr_4_50_59-60s_d64_s64_l4_id11_ckpt1_ft
        save_dir: logs
        project: BNS-PUBLICATION

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        save_top_k: 1
        filename: 'latest_{epoch:02d}'

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/gaussnll
        mode: min
        save_top_k: 1
        filename: 's4d_chirp_mass_gaussnll_{epoch:02d}'
        auto_insert_metric_name: false

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/mse/out_0
        mode: min
        save_top_k: 3
        filename: 's4d_chirp_mass_mse_{epoch:02d}'
        auto_insert_metric_name: false

    - class_path: train.callbacks.EarlyStopping
      init_args:
        monitor: val/mse/out_0
        mode: min
        patience: 2400
        verbose: true

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: train.utils.samples_per_second.SamplesPerSecondTimer
    - class_path: train.utils.data_wait_timer.DataWaitTimer

# =========================
# Model
# =========================
model:
  class_path: train.model.regression.LitS4DGaussianNLL
  init_args:
    d_input: 2          # H1, L1
    d_output: 2         # chirp_mass mean + chirp_mass var
    normalize_input: true
    y_mean: [1.2]      # center of chirp_mass prior [0.87, 2.22]
    y_std: [0.39]      # std of Uniform(0.87, 2.22) = (2.22-0.87)/(2*sqrt(3))
    d_model: 64
    d_state: 64
    n_layers: 4
    dropout: 0.2
    lr: 1e-5
    dt_min: 1.0e-5
    dt_max: 5
    base_lr: 5.0e-7
    weight_decay: 0.01
    beta_nll: 0.3
    lambda_spread: 0.3
    lr_scheduler:
      class_path: train.model.regression.WarmupCosineAnnealingWarmRestarts
      init_args:
        warmup_epochs: 8
        T_0: 10
        T_mult: 2
        eta_min: 1.0e-8
        warmup_start_factor: 1.0e-2
    lr_scheduler_interval: epoch

# =========================
# Data
# =========================
data:
  class_path: train.data.regression.RegressionTimeDomainDataset
  init_args:
    background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3a_H1_L1_4096Hz
    ifos: [H1, L1]
    sample_rate: 256
    kernel_length: 1.0
    left_pad: 0.5      # ~0.5s jitter; must satisfy left_pad + right_pad < kernel_length=1.0
    right_pad: 0.0
    fduration: 1.0
    psd_length: 20.0
    fftlength: 2.0
    highpass: 20.0
    # min_valid_duration: 15000  # seconds (~4.2 hours); files from end of sorted list
    min_valid_duration: 4000
    # val_batches_fraction: 0.1  # val batches = batches_per_epoch * this
    val_batches_fraction: 0.2
    max_num_workers: 16
    waveform_prob: 1.0
    target_parameters: [chirp_mass]
    prefetch_factor: 4
    persistent_workers: true
    batch_size: 512
    # batches_per_epoch: 782
    batches_per_epoch: 625
    n_val_waveforms: 2048
    # Disk waveforms (pre-generated polarizations) instead of on-the-fly.
    # File is 2048 Hz / 32 s / coal@30 s; resampled to sample_rate=256 internally.
    train_waveform_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/train/end_o3_ratesandpops_bns_uniform_chirp.hdf5
    val_waveform_file: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/aframe_data/val/end_o3_ratesandpops_bns_uniform_chirp.hdf5
    chunk_size: 2000
    chunks_per_epoch: 10
    snr_sampler:
      class_path: train.augmentations.SnrSampler
      init_args:
        max_min_snr: 20.0
        min_min_snr: 4.0
        max_snr: 50.0
        alpha: -3     # near-flat; alpha=0 not supported by PowerLaw
        decay_steps: 10000
    waveform_sampler:
      class_path: train.data.waveforms.generator.cbc_regression.RegressionCBCGenerator
      init_args:
        ifos: [H1, L1]
        sample_rate: 256
        # val_waveform_file: /path/to/val_waveforms.hdf5
        approximant:
          class_path: ml4gw.waveforms.IMRPhenomPv2
        duration: 32.0    # matches disk waveforms (coal at 32 - right_pad = 30s)
        right_pad: 2.0    # matches disk file right_pad (coal at 30s)
        window_offset: 3.0 # shift signal_idx 3s before coal → premerger window
        f_min: 20.0
        f_ref: 50.0
        training_prior:
          class_path: train.prior.AframePrior
          init_args:
            conversion_function: train.conversion.precessing_to_lalsimulation_parameters
            priors:
              chirp_mass:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0.87
                  high: 2.22
                  validate_args: false
              mass_ratio:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0.4
                  # high capped below 1.0: IMRPhenomPv2 returns all-NaN waveforms
                  # for near-equal-mass precessing systems (q > ~0.999, i.e.
                  # |m1-m2|/m1 < ~1e-3). A single NaN waveform poisons the model
                  # weights permanently. 0.99 is safely below the singularity and
                  # has negligible effect on the chirp_mass target. See
                  # NAN_INVESTIGATION.md.
                  high: 0.99
                  validate_args: false
              a_1:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0.0
                  high: 0.4
                  validate_args: false
              a_2:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0.0
                  high: 0.4
                  validate_args: false
              tilt_1:
                class_path: ml4gw.distributions.Sine
                init_args:
                  low: 0.0
                  high: 3.14159
                  validate_args: false
              tilt_2:
                class_path: ml4gw.distributions.Sine
                init_args:
                  low: 0.0
                  high: 3.14159
                  validate_args: false
              phi_12:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0.0
                  high: 6.28318
                  validate_args: false
              phi_jl:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0.0
                  high: 6.28318
                  validate_args: false
              inclination:
                class_path: ml4gw.distributions.Sine
                init_args:
                  low: 0.0
                  high: 3.14159
                  validate_args: false
              phic:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0.0
                  high: 6.28318
                  validate_args: false
              distance:
                class_path: ml4gw.distributions.UniformComovingVolume
                init_args:
                  minimum: 10
                  maximum: 500
                  distance_type: luminosity_distance
                  validate_args: false
    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 3.14159
        validate_args: false
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0.0
        high: 6.28318
        validate_args: false
