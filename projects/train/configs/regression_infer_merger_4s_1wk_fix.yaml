# 1-WEEK MERGER control RE-RUN with the two pipeline fixes:
#   integration_window_length: 0  -> no boxcar smearing of the sharp confidence spike
#   recovery_mode: window         -> recover each injection with the MAX detstat within
#                                    recovery_window s of injection_time (not closest-in-time)
# Positive control: expect SV > 0 if these capture the model's confident response.
# Geometry matches training ai4gw/chirp_mass_4s_d64_s64_l4_merger.yaml.

checkpoint: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe_linoss/projects/train/logs/BNS-PUBLICATION/chirp_mass_snr_4_50_merger_4s_d64_s64_l4_aframe_kyoon_dev_1/checkpoints/s4d_chirp_mass_mse_1959.ckpt
model_class: LitS4DGaussianNLL

background_dir: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/DATA/O3a_H1_L1_4096Hz
injection_set_fname: /n/holystore01/LABS/iaifi_lab/Lab/kyoon/aframe_linoss/runs/regression_sv/bns_injections/waveforms.hdf5

ifos: [H1, L1]
shifts:
  - [0, 1]
  - [0, 2]
  - [0, 3]
